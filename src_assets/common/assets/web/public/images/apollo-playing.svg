<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Apollo 2026">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#08D4F5"/>
      <stop offset="0.55" stop-color="#0AA6F5"/>
      <stop offset="1" stop-color="#0B6BFF"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#06D4F2"/>
      <stop offset="0.55" stop-color="#6FD3A7"/>
      <stop offset="1" stop-color="#F7B71D"/>
    </linearGradient>
    <linearGradient id="rocket" x1="0" y1="1" x2="0.8" y2="0">
      <stop offset="0" stop-color="#F2A007"/>
      <stop offset="1" stop-color="#FFC928"/>
    </linearGradient>
  </defs>

  <!-- Monitor screen -->
  <rect x="190" y="225" width="640" height="420" rx="30" fill="none" stroke="url(#screen)" stroke-width="38"/>
  <rect x="248" y="283" width="524" height="304" rx="16" fill="none" stroke="url(#screen)" stroke-width="26"/>

  <!-- Stand -->
  <path d="M468 645 L442 762 L582 762 L556 645" fill="none" stroke="#0B6BFF" stroke-width="34" stroke-linejoin="round"/>
  <rect x="360" y="764" width="300" height="50" rx="25" fill="none" stroke="#0B6BFF" stroke-width="34"/>

  <!-- Orbit swoosh -->
  <path d="M240 552 C236 612 300 642 382 628 C548 598 668 466 716 338"
        fill="none" stroke="url(#orbit)" stroke-width="30" stroke-linecap="round"/>

  <!-- Rocket -->
  <g>
    <path d="M704 352 C724 294 772 240 826 208 C834 256 812 314 762 372 Z" fill="url(#rocket)"/>
    <path d="M704 352 L668 340 L686 300 L722 314 Z" fill="url(#rocket)"/>
    <path d="M762 372 L792 398 L826 372 L806 338 Z" fill="url(#rocket)"/>
    <circle cx="786" cy="292" r="20" fill="#0B0D13" opacity="0.85"/>
  </g>
  <circle cx="800" cy="800" r="150" fill="#0B0D13"/>
  <circle cx="800" cy="800" r="122" fill="#22C55E"/>
</svg>
